stages:
  build:
    buildTool: maven
    buildToolVersion: MVNJ21

    _additional:
      stringVariables:
        - name: BRIDGE_POLARIS_SERVERURL
          value: "https://poc.polaris.blackduck.com"

        - name: BRIDGE_POLARIS_APPLICATION_NAME
          value: "EGC-SAP-CICD-Demo"

        - name: BRIDGE_POLARIS_PROJECT_NAME
          value: "hello-java"

        - name: BRIDGE_POLARIS_BRANCH_NAME
          value: "main"

      credentialVariables:
        - name: BRIDGE_POLARIS_ACCESSTOKEN
          credentialId: "polaris_token"

      runLast:
        command: "bash scripts/polaris-scan.sh"